name: AWS control-plane deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to update the production control plane
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-control-plane-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Configure scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: mandate-control-plane-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the default Neon branch
        run: |
          database_url="$(npx --yes neonctl@4.17.3 connection-string \
            --project-id "$NEON_PROJECT_ID" \
            --ssl verify-full \
            --no-color)"
          echo "::add-mask::$database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"

      - name: Build deployment artifact
        run: |
          pnpm --filter @mandate/api build:aws
          cd dist/aws/control-plane
          zip -q "$GITHUB_WORKSPACE/control-plane.zip" index.js package.json

      - name: Upload immutable artifact
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="mandate-deploy-${account_id}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
          fi
          aws s3api put-public-access-block --bucket "$bucket" --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-encryption --bucket "$bucket" --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          key="control-plane/${GITHUB_SHA}.zip"
          aws s3 cp control-plane.zip "s3://${bucket}/${key}" --only-show-errors
          echo "CODE_BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "CODE_KEY=$key" >> "$GITHUB_ENV"

      - name: Deploy control plane
        run: |
          aws cloudformation deploy \
            --stack-name mandate-control-plane \
            --template-file infra/aws/control-plane.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CodeBucket="$CODE_BUCKET" \
              CodeKey="$CODE_KEY" \
              DatabaseUrl="$DATABASE_URL"

      - name: Verify fail-closed endpoint
        run: |
          url="$(aws cloudformation describe-stacks \
            --stack-name mandate-control-plane \
            --query 'Stacks[0].Outputs[?OutputKey==`ControlPlaneUrl`].OutputValue' \
            --output text)"
          health="$(curl --fail --silent --show-error "${url}health")"
          test "$(jq -r .status <<<"$health")" = "ok"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${url}v1/mandates/unavailable")"
          test "$status" = "401"
          echo "Control plane: $url" >> "$GITHUB_STEP_SUMMARY"
