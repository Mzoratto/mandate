AWSTemplateFormatVersion: "2010-09-09"
Description: Mandate authenticated control-plane Lambda Function URL

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  DatabaseUrl:
    Type: String
    NoEcho: true

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mandate-control-plane-lambda-us-east-1
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mandate-control-plane
      Description: Authenticated outcome-bound authority control plane
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Function}
      RetentionInDays: 14

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      InvokeMode: BUFFERED
      TargetFunctionArn: !GetAtt Function.Arn

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref Function
      FunctionUrlAuthType: NONE
      Principal: "*"

  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      InvokedViaFunctionUrl: true
      Principal: "*"

Outputs:
  ControlPlaneUrl:
    Description: HTTPS origin for the Mandate control plane
    Value: !GetAtt FunctionUrl.FunctionUrl
  LogGroup:
    Value: !Ref FunctionLogGroup
