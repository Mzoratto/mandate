AWSTemplateFormatVersion: "2010-09-09"
Description: Mandate authenticated control-plane Lambda behind an HTTP API

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  DatabaseUrl:
    Type: String
    NoEcho: true
  McpResourceUrl:
    Type: String
    Default: ""
  McpAllowedOrigins:
    Type: String
    Default: ""
  McpAuthorizationServerUrl:
    Type: String
    Default: ""
  McpJwksUrl:
    Type: String
    Default: ""
  McpOAuthClientIds:
    Type: String
    Default: ""
  McpCheckoutCommitDigest:
    Type: String
    Default: ""

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mandate-control-plane-lambda-us-east-1
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mandate-control-plane
      Description: Authenticated outcome-bound authority control plane
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          MANDATE_MCP_RESOURCE_URL: !Ref McpResourceUrl
          MANDATE_MCP_ALLOWED_ORIGINS: !Ref McpAllowedOrigins
          MANDATE_MCP_AUTHORIZATION_SERVER_URL: !Ref McpAuthorizationServerUrl
          MANDATE_MCP_JWKS_URL: !Ref McpJwksUrl
          MANDATE_MCP_OAUTH_CLIENT_IDS: !Ref McpOAuthClientIds
          MANDATE_MCP_CHECKOUT_COMMIT_DIGEST: !Ref McpCheckoutCommitDigest

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Function}
      RetentionInDays: 14

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: mandate-control-plane
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  HttpApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  ControlPlaneUrl:
    Description: Rate-limited HTTPS origin for the Mandate control plane
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/
  LogGroup:
    Value: !Ref FunctionLogGroup
