services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: mandate
      POSTGRES_PASSWORD: mandate_local
      POSTGRES_USER: mandate
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mandate-postgres:/var/lib/postgresql/data

volumes:
  mandate-postgres:
