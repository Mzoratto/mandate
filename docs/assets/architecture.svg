<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mandate outcome-bound agent authority architecture</title>
  <desc id="desc">Alexa Plus or a protected simulated client calls a deployed MCP boundary. The Mandate control plane stores immutable authority in Neon, separates human approval, authorizes AgentOS effects, meters execution, and accepts independent evidence before completion. Durable queue dispatch is explicitly marked as not yet deployed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071013"/>
      <stop offset="0.56" stop-color="#050a0d"/>
      <stop offset="1" stop-color="#081013"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8ba0aa" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#63e6f2"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#45ddb1"/>
    </marker>
    <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#71808a"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 3px; fill: #8fa0aa; }
      .title { font-size: 42px; font-weight: 520; letter-spacing: -1.4px; fill: #eef4f6; }
      .subtitle { font-size: 17px; fill: #9cabb3; }
      .node-title { font-size: 20px; font-weight: 540; fill: #eef4f6; }
      .node-copy { font-size: 14px; fill: #94a4ad; }
      .node-small { font-size: 12px; fill: #7f909a; }
      .label { font-size: 11px; font-weight: 650; letter-spacing: 1.8px; }
      .box { fill: #091115; stroke: #27343a; stroke-width: 1; }
      .box-cyan { fill: #091419; stroke: #2d7c86; stroke-width: 1; }
      .box-green { fill: #091612; stroke: #28735e; stroke-width: 1; }
      .box-amber { fill: #15130d; stroke: #756026; stroke-width: 1; }
      .line { fill: none; stroke: #63e6f2; stroke-width: 1.5; marker-end: url(#cyan-arrow); }
      .line-green { fill: none; stroke: #45ddb1; stroke-width: 1.5; marker-end: url(#green-arrow); }
      .line-dashed { fill: none; stroke: #71808a; stroke-width: 1.25; stroke-dasharray: 7 7; marker-end: url(#gray-arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g class="sans">
    <g transform="translate(66 58)">
      <circle cx="18" cy="18" r="18" fill="none" stroke="#41bbc8"/>
      <text x="18" y="24" text-anchor="middle" font-size="18" fill="#72dce7">M</text>
      <text class="eyebrow" x="52" y="14" fill="#eef4f6">MANDATE</text>
      <text class="mono" x="52" y="34" font-size="9" letter-spacing="2" fill="#72848e">OUTCOME-BOUND AUTHORITY</text>
    </g>

    <text class="eyebrow" x="66" y="140">SYSTEM ARCHITECTURE · CLAIM-LOCKED</text>
    <text class="title" x="66" y="193">Authority is immutable. Plans may change.</text>
    <text class="subtitle" x="66" y="227">One deployed backend, two client paths, a separate human gate, and independent evidence before completion.</text>

    <g transform="translate(1214 58)">
      <rect width="320" height="108" rx="12" fill="#091115" stroke="#27343a"/>
      <circle cx="20" cy="22" r="4" fill="#63e6f2"/>
      <text class="label" x="35" y="26" fill="#75dce7">DEPLOYED</text>
      <line x1="18" y1="47" x2="34" y2="47" stroke="#71808a" stroke-dasharray="4 4"/>
      <text class="label" x="44" y="51" fill="#8a99a2">NOT YET DEPLOYED</text>
      <circle cx="20" cy="72" r="4" fill="#45ddb1"/>
      <text class="label" x="35" y="76" fill="#57dcb5">VERIFIED</text>
      <circle cx="20" cy="96" r="4" fill="#d7a72f"/>
      <text class="label" x="35" y="100" fill="#d9b64e">EXTERNAL BLOCKER</text>
    </g>

    <!-- Client paths -->
    <text class="eyebrow" x="66" y="306">01 · HUMAN INTERFACE</text>
    <g transform="translate(66 329)">
      <rect class="box-amber" width="270" height="112" rx="12"/>
      <circle cx="22" cy="22" r="4" fill="#d7a72f"/>
      <text class="label" x="36" y="26" fill="#d9b64e">PRIMARY · BLOCKED</text>
      <text class="node-title" x="20" y="60">Alexa+ MCP add-on</text>
      <text class="node-copy" x="20" y="84">Intent + retry identity only</text>
      <text class="node-small" x="20" y="104">Amazon toolkit trust unavailable</text>
    </g>
    <g transform="translate(66 461)">
      <rect class="box-cyan" width="270" height="112" rx="12"/>
      <circle cx="22" cy="22" r="4" fill="#63e6f2"/>
      <text class="label" x="36" y="26" fill="#75dce7">FALLBACK · DEPLOYED</text>
      <text class="node-title" x="20" y="60">Simulated Alexa+ client</text>
      <text class="node-copy" x="20" y="84">Protected browser surface</text>
      <text class="node-small" x="20" y="104">No voice capture · no account linking</text>
    </g>

    <!-- MCP boundary -->
    <path class="line-dashed" d="M336 385 H396 V402 H432"/>
    <path class="line" d="M336 517 H396 V458 H432"/>
    <g transform="translate(432 329)">
      <rect class="box-cyan" width="306" height="244" rx="14"/>
      <circle cx="22" cy="22" r="4" fill="#63e6f2"/>
      <text class="label" x="36" y="26" fill="#75dce7">AWS · DEPLOYED</text>
      <text class="node-title" x="20" y="63">MCP authority boundary</text>
      <text class="node-copy" x="20" y="90">API Gateway + Lambda</text>
      <text class="mono" x="20" y="120" font-size="12" fill="#a7bac4">MCP 2025-11-25</text>
      <line x1="20" y1="138" x2="286" y2="138" stroke="#27343a"/>
      <text class="mono" x="20" y="164" font-size="11" fill="#72dce7">prepare_agent_work</text>
      <text class="mono" x="20" y="188" font-size="11" fill="#72dce7">get_agent_work_status</text>
      <text class="mono" x="20" y="212" font-size="11" fill="#72dce7">explain_blocked_action</text>
      <text class="node-small" x="20" y="233">Strict validation · origin checks · no-store</text>
    </g>

    <!-- Control plane -->
    <path class="line" d="M738 451 H790"/>
    <g transform="translate(790 329)">
      <rect class="box-cyan" width="356" height="244" rx="14"/>
      <circle cx="22" cy="22" r="4" fill="#63e6f2"/>
      <text class="label" x="36" y="26" fill="#75dce7">AUTHORITATIVE · DEPLOYED</text>
      <text class="node-title" x="20" y="63">Mandate control plane</text>
      <text class="node-copy" x="20" y="90">Immutable authority envelope + event ledger</text>
      <line x1="20" y1="112" x2="336" y2="112" stroke="#27343a"/>
      <text class="node-small" x="20" y="141">Server resolves principal, agent, commit,</text>
      <text class="node-small" x="20" y="162">effects, limits, assumptions, and verifiers.</text>
      <g transform="translate(20 184)">
        <rect width="148" height="38" rx="19" fill="#0b1c21" stroke="#2d7c86"/>
        <text class="mono" x="74" y="24" text-anchor="middle" font-size="11" fill="#72dce7">AWAITING_APPROVAL</text>
      </g>
      <text class="node-small" x="184" y="208">Preparation stops here</text>
    </g>

    <!-- Neon -->
    <path class="line" d="M1146 404 H1196"/>
    <g transform="translate(1196 329)">
      <rect class="box-cyan" width="338" height="112" rx="12"/>
      <circle cx="22" cy="22" r="4" fill="#63e6f2"/>
      <text class="label" x="36" y="26" fill="#75dce7">TRANSACTIONAL · DEPLOYED</text>
      <text class="node-title" x="20" y="60">Neon Postgres</text>
      <text class="node-copy" x="20" y="84">20 verified tables · replay-safe writes</text>
      <text class="node-small" x="20" y="104">Hashed bearers · scoped ownership</text>
    </g>

    <!-- Status return -->
    <path d="M1196 484 H1170 V548 H1146" fill="none" stroke="#63e6f2" stroke-width="1.5" marker-end="url(#cyan-arrow)"/>
    <g transform="translate(1196 461)">
      <rect class="box" width="338" height="112" rx="12"/>
      <text class="label" x="20" y="27" fill="#75dce7">MINIMIZED STATUS RETURN</text>
      <text class="node-title" x="20" y="61">Outcome, state, evidence count</text>
      <text class="node-copy" x="20" y="86">No evidence body or credential returned</text>
      <text class="node-small" x="20" y="105">Alexa communicates result; Mandate owns truth</text>
    </g>

    <!-- Governance chain -->
    <text class="eyebrow" x="66" y="648">02 · CONSEQUENCE AND COMPLETION PATH</text>
    <g transform="translate(66 671)">
      <rect class="box-amber" width="288" height="142" rx="12"/>
      <circle cx="22" cy="22" r="4" fill="#d7a72f"/>
      <text class="label" x="36" y="26" fill="#d9b64e">SEPARATE CEREMONY</text>
      <text class="node-title" x="20" y="60">Human approval gate</text>
      <text class="node-copy" x="20" y="86">Principal + digest + version + nonce</text>
      <text class="node-small" x="20" y="110">Single-use · expires · not a model tool</text>
      <text class="node-small" x="20" y="130">No public HTTP approval route</text>
    </g>

    <path class="line" d="M354 742 H404"/>
    <g transform="translate(404 671)">
      <rect class="box-cyan" width="278" height="142" rx="12"/>
      <circle cx="22" cy="22" r="4" fill="#63e6f2"/>
      <text class="label" x="36" y="26" fill="#75dce7">PUBLIC · REHEARSED</text>
      <text class="node-title" x="20" y="60">AgentOS reference host</text>
      <text class="node-copy" x="20" y="86">Intercept every normalized effect</text>
      <text class="node-small" x="20" y="110">Deny first · stop on denial</text>
      <text class="node-small" x="20" y="130">Deterministic zero-model proof</text>
    </g>

    <path class="line" d="M682 742 H732"/>
    <g transform="translate(732 671)">
      <rect class="box" width="240" height="142" rx="12"/>
      <text class="label" x="20" y="26" fill="#75dce7">TRUSTED ORDER</text>
      <text class="node-title" x="20" y="60">Meter + settle</text>
      <text class="node-copy" x="20" y="86">Usage before evidence</text>
      <text class="node-small" x="20" y="110">1 governed action</text>
      <text class="node-small" x="20" y="130">0 model tokens · $0 direct spend</text>
    </g>

    <path class="line-green" d="M972 742 H1022"/>
    <g transform="translate(1022 671)">
      <rect class="box-green" width="292" height="142" rx="12"/>
      <circle cx="22" cy="22" r="4" fill="#45ddb1"/>
      <text class="label" x="36" y="26" fill="#57dcb5">INDEPENDENT</text>
      <text class="node-title" x="20" y="60">Verifier + private evidence</text>
      <text class="node-copy" x="20" y="86">Digest-bound attestations in S3</text>
      <text class="node-small" x="20" y="110">Encrypted · versioned · Object Lock</text>
      <text class="node-small" x="20" y="130">Agent trace cannot complete outcome</text>
    </g>

    <path class="line-green" d="M1314 742 H1356"/>
    <g transform="translate(1356 671)">
      <rect class="box-green" width="178" height="142" rx="12"/>
      <circle cx="22" cy="22" r="4" fill="#45ddb1"/>
      <text class="label" x="36" y="26" fill="#57dcb5">VERIFIED</text>
      <text class="node-title" x="20" y="61">COMPLETED</text>
      <text class="node-copy" x="20" y="89">All criteria</text>
      <text class="node-copy" x="20" y="110">independently</text>
      <text class="node-copy" x="20" y="131">satisfied</text>
    </g>

    <!-- Future production execution -->
    <path class="line-dashed" d="M543 813 V848 H846"/>
    <g transform="translate(858 830)">
      <text class="mono" x="0" y="0" font-size="11" fill="#71808a">NOT YET DEPLOYED: outbox / SQS → isolated durable worker → generalized interception + real provider accounting</text>
    </g>
  </g>
</svg>
